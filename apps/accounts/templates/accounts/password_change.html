{% extends 'portal/base.html' %}

{% block title %}Change Password - ConnectPro WiFi{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto py-12 px-6">
    <div class="premium-card p-8 rounded-[3rem] relative overflow-hidden">
        <!-- Visual Decoration -->
        <div class="absolute -right-16 -top-16 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
        
        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-gradient-to-br from-primary to-blue-700 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-blue-200 animate-float">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900 mb-1 tracking-tight">Security</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Update Password</p>
        </div>

        <form method="post" class="space-y-5 relative z-10">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-[8px] font-black text-slate-400 uppercase tracking-widest mb-2.5 ml-2">{{ field.label }}</label>
                    <div class="relative group">
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.name }}"
                               id="{{ field.id_for_label }}"
                               class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl py-3.5 px-5 text-slate-900 font-bold focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm group-hover:bg-white shadow-sm">
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 text-[8px] font-black mt-2 ml-2 italic">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full btn-primary text-white font-black py-4.5 rounded-2xl shadow-xl transition-all mt-2 text-sm flex items-center justify-center gap-2">
                <span>Save Changes</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </button>
        </form>

        <div class="mt-8 text-center relative z-10">
            <a href="{% url 'profile' %}" class="text-[10px] font-black text-slate-400 hover:text-primary uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Return to Profile
            </a>
        </div>
    </div>
</div>
{% endblock %}
