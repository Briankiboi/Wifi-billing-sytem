{% extends 'dashboard/base_admin.html' %}

{% block title %}Edit Package - NetBilling{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <header class="mb-10">
        <a href="{% url 'admin-packages' %}" class="text-indigo-400 text-sm font-bold flex items-center gap-2 mb-4 hover:gap-3 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Packages
        </a>
        <h2 class="text-3xl font-bold text-white tracking-tight">Edit Package</h2>
        <p class="text-slate-500">Modify pricing and technical specifications for <strong>{{ package.name }}</strong></p>
    </header>

    <div class="card p-10">
        <form method="post" class="space-y-8">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 tracking-widest mb-3">Package Name</label>
                    <input type="text" name="name" value="{{ package.name }}" required
                           class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 px-6 text-white font-bold focus:border-indigo-500 outline-none transition-all shadow-xl shadow-black/20">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 tracking-widest mb-3">Price (KES)</label>
                    <input type="number" name="price" value="{{ package.price }}" required
                           class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 px-6 text-white font-bold focus:border-indigo-500 outline-none transition-all shadow-xl shadow-black/20">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 tracking-widest mb-3">Speed Limit (Mbps)</label>
                    <input type="number" name="mbps_down" value="{{ package.mbps_down }}" required
                           class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 px-6 text-white font-bold focus:border-indigo-500 outline-none transition-all shadow-xl shadow-black/20">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 tracking-widest mb-3">Duration (Minutes)</label>
                    <input type="number" name="duration_minutes" value="{{ package.duration_minutes }}" required
                           class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 px-6 text-white font-bold focus:border-indigo-500 outline-none transition-all shadow-xl shadow-black/20">
                    <p class="text-[10px] text-slate-500 mt-2 italic font-bold">1440 mins = 24 hours</p>
                </div>
            </div>

            <div class="pt-6 border-t border-slate-800 flex gap-4">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 px-10 rounded-2xl transition-all shadow-xl shadow-indigo-500/20 uppercase tracking-widest text-sm">
                    Save Changes
                </button>
                <a href="{% url 'admin-packages' %}" class="bg-slate-800 hover:bg-slate-700 text-white font-black py-4 px-10 rounded-2xl transition-all uppercase tracking-widest text-sm flex items-center justify-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
